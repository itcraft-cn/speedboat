# Speedboat 阶段六 vboxnet0 网络分区专项配置（宿主机 + 虚机三机共用一份）
#
# 拓扑（设计文档 2026-10-10-04 §9，三路语义已实测）：
#   主机房 dc-0 = vbox 三虚机，host-only 地址 172.22.133.251/252/253（enp0s8/vboxnet0）
#   备机房 dc-1 = 宿主机三个本地进程，配置地址均为 172.22.133.1、端口 21001/21002/21003
#     （绑 0.0.0.0：NettyTransport 现状 bind(port)；同 IP 多进程身份由
#       -Dspeedboat.local.ip + -Dspeedboat.local.port 双钉定）
#
# 机房 ID 不设 datacenter=，走默认 dc-0/dc-1；父组身份 = 子组身份 + offset。
# 分区窗口语义：
#   停用 vboxnet0 → 172.22.133.1 从宿主机消失，宿主机补 lo 别名保住本机三进程互连；
#   虚机访问 172.22.133.1 需经 vboxnet0 物理链路 → 跨房断、两房内部各自连通。

# 机房0（主机房 = 虚机三台）
nodes.0.0=172.22.133.251:21001
nodes.0.1=172.22.133.252:21001
nodes.0.2=172.22.133.253:21001

# 机房1（备机房 = 宿主机三进程，同 IP 多端口）
nodes.1.0=172.22.133.1:21001
nodes.1.1=172.22.133.1:21002
nodes.1.2=172.22.133.1:21003

# 父组端口偏移：父组 = 子组端口 + 1000（全集群一致）
# 虚机三台子组 21001 → 父组 22001；宿主三进程 2100x → 2200x
cross.port.offset=1000

# 父组机房权重：主机房 2、备机房 1 → required=(2+1)/2+1=2
#   主机房 self=2 ≥ 2 可单方成主；备机房 self=1 < 2 不可（CP 下退化为无主）
datacenter.weight.dc-0=2
datacenter.weight.dc-1=1

# 机房内选举超时（两房内部均为低延迟链路：虚机间 host-only / 宿主 loopback）
election.intra.timeout.min=1000
election.intra.timeout.max=2000

# 父组（跨机房）选举超时：停用窗口内需支撑 AP 降级接管（阈值 10s 后开始选举）
election.cross.timeout.min=3000
election.cross.timeout.max=5000

# 持久化：mmap 跨进程重启挂回；data/ 按 nodeId 分子目录（宿主三进程共享 data 根）
raft.persistence=mmap
raft.persistence.dir=data
raft.mmap.size.mb=64

# 命名锁租约（验证期间按周期竞争，短持有后释放）
lock.lease.ms=30000
