# Speedboat 六节点双机房（跨机房级联模式）实机验证配置
#
# 主机房 = 机房0：192.168.193.174/175/176（aarch64 容器，主力）
# 备机房 = 机房1：192.168.193.51/53/55（x86_64 容器，容灾）
#
# nodes.{机房索引}.{节点索引}=ip:port
# 节点数分组 > 1 → Speedboat 自动进入 cross-datacenter(cascade) 模式，
# 每个机房各自组成一个 Raft 组（见 Speedboat.doStartCrossDatacenterMode）。
#
# 注意：不设置 datacenter= 时，机房 ID 走默认 dc-{index}（dc-0/dc-1），
# 可在测试节点日志 event=START 的 dc= 字段直接区分机房归属；若显式配置
# datacenter=<名称>，则两个机房会拿到同一个 ID（当前实现如此），不利于观测。

# 机房0（主机房）
nodes.0.0=192.168.193.174:21001
nodes.0.1=192.168.193.175:21001
nodes.0.2=192.168.193.176:21001

# 机房1（备机房）
nodes.1.0=192.168.193.51:21001
nodes.1.1=192.168.193.53:21001
nodes.1.2=192.168.193.55:21001

# 机房内选举超时：跨机房模式实际只使用 intra 超时建组（cross 超时会被读取但未被接入）
election.intra.timeout.min=1000
election.intra.timeout.max=2000

# 机房间选举超时：按设计应服务于跨机房级联父组选举；当前实现读取后未使用，保留以对齐文档
election.cross.timeout.min=3000
election.cross.timeout.max=5000

# 持久化：生产缺省 mmap（跨进程重启挂回；目录 data/{nodeId}/）
raft.persistence=mmap
raft.persistence.dir=data
raft.mmap.size.mb=64

# 命名锁租约（验证期间按周期竞争，短持有后释放）
lock.lease.ms=30000
