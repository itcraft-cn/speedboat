# Speedboat 六节点双机房（跨机房级联模式）实机验证配置
#
# 主机房 = 机房0：192.168.193.174/175/176（aarch64 容器，主力）
# 备机房 = 机房1：192.168.193.51/53/55（x86_64 容器，容灾）
#
# nodes.{机房索引}.{节点索引}=ip:port
# 节点数分组 > 1 → Speedboat 自动进入 cross-datacenter(cascade) 双层模式：
#   子组（机房内层）= 本机房 3 节点，端口 21001，选出"本机房代表"
#   父组（跨机房层）= 各机房的子组 Leader，端口 21001+cross.port.offset=22001，选出"全局主"
# 全局唯一主条件：isMain = 本进程既是子组 Leader，又在父组当选。
#
# 机房 ID：不设置 datacenter= 时走默认 dc-{index}（dc-0/dc-1）。跨机房模式下
# datacenter= 配置值会自动追加 -{索引} 以保证两机房 ID 唯一（否则按机房判权的
# 策略会全部失效），本配置保持不设，直接观察 dc-0/dc-1。
#
# 机房权重（父组选举的唯一性保障）：主机房 2、备机房 1，父组门槛 required=(2+1)/2+1=2。
#   主机房 self=2 ≥ 2 → 可单方成主（分区、杀光备机房时仍唯一为 1 主）
#   备机房 self=1 < 2 → 不可单方成主（主机房死亡时退化为 0 主，需人工升级接管）
# 不显式配置时按 索引派生 = 机房总数 - 索引，得到同样的 2/1；此处写出便于核对。

# 机房0（主机房）
nodes.0.0=192.168.193.174:21001
nodes.0.1=192.168.193.175:21001
nodes.0.2=192.168.193.176:21001

# 机房1（备机房）
nodes.1.0=192.168.193.51:21001
nodes.1.1=192.168.193.53:21001
nodes.1.2=192.168.193.55:21001

# 父组端口偏移：父组绑定 端口 = 子组端口 + 本偏移（必须全集群一致，否则互不可达）
cross.port.offset=1000

# 父组机房权重（键 = 机房 ID；未列出的机房走兜底权重 1）
datacenter.weight.dc-0=2
datacenter.weight.dc-1=1

# 子组（机房内）选举超时：机房内成员全在同一局域网，可用低延迟窗口
election.intra.timeout.min=1000
election.intra.timeout.max=2000

# 父组（跨机房）选举超时：跨机房链路抖动大，需更长窗口避免 term 膨胀
election.cross.timeout.min=3000
election.cross.timeout.max=5000

# 持久化：生产缺省 mmap（跨进程重启挂回；目录 data/{nodeId}/）
# 子组与父组各一份独立 store（按各自 nodeId 分目录），term/votedFor 互不污染
raft.persistence=mmap
raft.persistence.dir=data
raft.mmap.size.mb=64

# 命名锁租约（验证期间按周期竞争，短持有后释放）
lock.lease.ms=30000
