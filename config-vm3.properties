# Speedboat 三机 VirtualBox 实机验证配置（单机房扁平模式）
#
# 被测三台 VM（互信、Java8 Dragonwell）：
#   vboxdeb001 -> 192.168.77.101
#   vboxdeb002 -> 192.168.77.102
#   vboxdeb003 -> 192.168.77.103
#
# 三机均监听同一端口（IP 不同，不冲突）；本机 IP 由 -Dspeedboat.local.ip 显式钉定。
# 这样每个进程只会匹配到 nodes.* 中的一行，nodeId 全网一致（node-<ip>-<port>）。

nodes.0.0=192.168.77.101:21001
nodes.0.1=192.168.77.102:21001
nodes.0.2=192.168.77.103:21001

# 机房内选举超时（测试加速；越大越稳重、越小切换越快）
election.intra.timeout.min=1000
election.intra.timeout.max=2000

# 持久化档：显式 mmap，验证"跨重启挂回"（term / 锁 epoch 保真）。
# 相对目录基于进程工作目录（~speedboat-test/data），各节点自动按 nodeId 分子目录。
raft.persistence=mmap
raft.persistence.dir=data
raft.mmap.size.mb=64
raft.mmap.file.name=raft.mmap

# 命名锁租约；显式释放的场景下取默认即可
lock.lease.ms=30000
