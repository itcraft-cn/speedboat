# Speedboat 命名锁样例：报价三名目场景（A 持外汇 / B 持贵金属 / C 持商品）
#
# 一个 Raft 组承载三名目；框架不参与业务接管，只保证：
#   同名目锁任意时刻恰好一个持有者；可续期/可释放；失联 → 租约到期 → 公平竞争接管（非抢占）
#
# 各节点建议持有逻辑：
#   A（本文件持有方之一）:   Speedboat.getLock("forex").tryLock()  → 持有后发布外汇
#   B:                       Speedboat.getLock("metals").tryLock()
#   C:                       Speedboat.getLock("commodity").tryLock()

nodes.0.0=192.168.10.1:31001
nodes.0.1=192.168.10.2:31002
nodes.0.2=192.168.10.3:31003

election.intra.timeout.min=1000
election.intra.timeout.max=2000

# 钉主亲和（可选）：权重把 A 钉为外汇优先持有者；同理 B/C 分组配置各自 prefer
# 权重表为集群级拓扑事实，必须全网一致
# vote.weight.strategy=prefer
# vote.weight.prefer=node-192.168.10.1-31001
# vote.weight.prefer.weight=3

mmap 持久化为缺省：重启副本可挂回（锁表 + epoch 跨重启保真）；无需显式配置。如下显式写出仅作示范。
raft.persistence=mmap
raft.persistence.dir=speedboat-data
raft.mmap.size.mb=128
raft.mmap.file.name=raft.mmap
raft.checkpoint.interval=1024
# lock.lease.ms=30000   # 租约越短，失联迁移越快（接管时延=剩余租约）
