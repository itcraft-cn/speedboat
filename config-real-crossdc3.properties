# Speedboat 三机房（跨机房级联模式）六节点实机验证配置（real-crossdc3-test.sh 专用）
#
# 拓扑（用户指定，2026-10-10）：
#   机房0（主机房）= 192.168.193.51 / .53          权重 3
#   机房1          = 192.168.193.55 / .174        权重 2
#   机房2          = 192.168.193.175 / .176       权重 2
#   即 3/2/2 拓扑，total=3+2+2=7，父组门槛 required=7/2+1=4（整数除法）。
#
# 三机房权重物理（与双机房 2/1 的关键差异，场景断言的依据）：
#   主机房 self=3 < required=4 —— 三机房下主机房【不能单方成主】，必须再收任一
#   备机房的一票（3+2=5 ≥ 4）。机房优先级仍成立：备机房候选拿不到主机房的票
#   （shouldGrantVote 拒绝 2 < 3 的低权重候选），但两个备机房【可互相授票】联手
#   成主（2+2=4 ≥ 4）——因此：
#     · 基线      主机房正常时全局主在 dc-0（机房优先 + 先到位即 sticky）；
#     · 杀光主机房 CP 下不再退化为【无主】：dc-1/dc-2 联手凑齐 required（4≥4）
#                 仍产生唯一主（标准 Raft 同 term 单票不变式保证只有一主）；
#     · 杀光两备机房 才退化为【无主】（CP）——此时 self=3 < required=4；
#     · AP 降级剔除一个失联机房后 total=5、required=3，主机房 self=3 ≥ 3 可接管。
#   唯一性由"同 term 单投票权"的 Raft 原始不变式保证（多机房下不再依赖双房的
#   "两权重之和=total"的数学结构论证），脚本 P5 以全程 isMain ≤ 1 验收。
#
# nodes.{机房索引}.{节点索引}=ip:port
# 节点数分组 > 1 → Speedboat 自动进入 cross-datacenter(cascade) 双层模式：
#   子组（机房内层，每房 2 节点）端口 21001 → 选出"本机房代表"
#   父组（跨机房层）端口 21001+cross.port.offset=22001 → 代表角逐"全局主"
# 机房 ID 不显式配置：跨机房模式自动按 dc-<index> 生成（dc-0/dc-1/dc-2）。

# 机房0（主机房，权重 3）
nodes.0.0=192.168.193.51:21001
nodes.0.1=192.168.193.53:21001

# 机房1（权重 2）
nodes.1.0=192.168.193.55:21001
nodes.1.1=192.168.193.174:21001

# 机房2（权重 2）
nodes.2.0=192.168.193.175:21001
nodes.2.1=192.168.193.176:21001

# 父组端口偏移（全集群一致，否则互不可达）
cross.port.offset=1000

# 父组机房权重 3/2/2（键 = 机房 ID）
datacenter.weight.dc-0=3
datacenter.weight.dc-1=2
datacenter.weight.dc-2=2

# 子组（机房内）选举超时
election.intra.timeout.min=1000
election.intra.timeout.max=2000

# 父组（跨机房）选举超时：三机房下席位争夺需要更多轮 term 爬升，窗口放宽
election.cross.timeout.min=3000
election.cross.timeout.max=5000

# 持久化：mmap（跨进程重启挂回；子组与父组各一份独立 store，按 nodeId 分目录）
raft.persistence=mmap
raft.persistence.dir=data
raft.mmap.size.mb=64

# 命名锁租约
lock.lease.ms=30000
