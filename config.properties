# Speedboat 单机房示例配置（3 节点）

# 节点列表（必需）
# 格式：nodes.{机房索引}.{节点索引}=ip:port
# 同机多进程时各节点端口必须互不相同；同机一个端口 = 一个成员身份
nodes.0.0=127.0.0.1:20001
nodes.0.1=127.0.0.1:20002
nodes.0.2=127.0.0.1:20003

# 机房内选举超时（可选，默认 1000-2000ms）
election.intra.timeout.min=1000
election.intra.timeout.max=2000

# ----以下均可选，缺省即生效----

# 投票权重（钉主场景）：权重表为集群级拓扑事实，各节点必须一致
# vote.weight.strategy=prefer
# vote.weight.prefer=node-127.0.0.1-20001
# vote.weight.prefer.weight=3

# 持久化三档：mmap（默认，跨进程重启挂回）/ mem（显式内存档，跨进程重启丢 term 与锁状态）/ none
# 未配置即默认 mmap——不配置也将落到 {raft.persistence.dir}/{nodeId}/ 落盘
# raft.persistence=mmap   # 缺省即 mmap；显式 none 关闭
# raft.persistence.dir=speedboat-data
# raft.mmap.size.mb=128
# raft.mmap.file.name=raft.mmap
# raft.max.log.size=4096
# raft.checkpoint.interval=1024
# lock.lease.ms=30000

# 成员自动剔除（默认关闭=静态成员；不建议开启，防网络抖动误剔除致孤岛选主）
# membership.auto.removal=true
