# Loop Configuration: Speedboat Cluster Election Test

name: "speedboat_cluster_election_loop"
description: "集群选举和成员变更功能验证循环"
level: "L4"
exit_condition: "测试达到预期——正常选举出新主节点，正常重加入"

## 测试目标
验证 Speedboat 分布式系统的选举和成员变更功能：
1. ✓ 初始三个节点能选举出主节点
2. ✓ 主节点故障后能重新选举出新主节点
3. ✓ 原主节点重启后能正常重加入集群
4. ✓ 最终集群状态保持正常

## Loop Pattern: Reflexion + Generate-Critique-Rewrite
pattern: "reflexion"
memory_store: ".loop/cluster-election-memory.json"
max_iterations: 5
quality_threshold: 85

## 工作流程
workflow:
  - phase: "环境准备"
    steps:
      - verify_java_environment
      - verify_maven_build
      - clean_previous_runs
      
  - phase: "编译测试"
    steps:
      - compile_project
      - compile_test_classes
      - verify_dependencies
      
  - phase: "执行测试"
    steps:
      - run_cluster_test:
          nodes: 3
          timeout: 30s
          
  - phase: "结果分析"
    steps:
      - analyze_logs:
          patterns:
            - "主节点是"
            - "新主节点是"
            - "活跃节点数量"
            - "测试通过"
      - extract_metrics:
          - election_time
          - re_election_time
          - rejoin_time
          
  - phase: "验证和记录"
    steps:
      - validate_expected_outcomes
      - store_test_results
      - update_memory:
          successes: []
          failures: []
          patterns: []

## 验证条件
validation_conditions:
  - condition: "initial_leader_elected"
    description: "初始阶段成功选举出主节点"
    metrics:
      - leader_detected: true
      - election_complete_within: "5s"
      
  - condition: "re_election_after_failure"
    description: "主节点故障后重新选举成功"
    metrics:
      - new_leader_detected: true
      - re_election_complete_within: "8s"
      - no_duplicate_leaders: true
      
  - condition: "node_rejoin_successful"
    description: "原主节点成功重加入集群"
    metrics:
      - all_nodes_active: 3
      - cluster_stable: true
      
  - condition: "final_state_healthy"
    description: "最终集群状态健康"
    metrics:
      - exactly_one_leader: true
      - all_nodes_communicating: true

## 退出条件（达成以下所有条件时退出）
exit_criteria:
  - all_validation_conditions_met: true
  - test_passed_count >= 3
  - consecutive_successes >= 2
  
## 错误处理
error_handling:
  - on_compilation_failure:
      action: "fix_compilation_errors"
      retry: 2
      
  - on_test_timeout:
      action: "analyze_deadlock"
      timeout_threshold: "60s"
      
  - on_election_failure:
      action: "increase_logging_level"
      debug_mode: true
      
  - on_membership_issue:
      action: "check_membership_coordinator"
      verify_config: true

## 报告
reporting:
  format: "markdown"
  sections:
    - "执行摘要"
    - "测试场景描述"
    - "详细步骤"
    - "关键发现"
    - "性能指标"
    - "问题和解决"
    - "最终验证结果"
  output_files:
    - "loop-results/cluster-election-report-{{timestamp}}.md"
    - "loop-results/performance-metrics-{{timestamp}}.json"

## 迭代改进
iterative_improvement:
  - after_each_run:
      - store_lessons_learned
      - update_test_parameters
      - refine_wait_times
      
  - if_failure:
      - analyze_root_cause
      - apply_reflexion:
          questions:
            - "我假设了什么？"
            - "假设为什么错？"
            - "下次有什么不同？"
      - update_strategy
      
  - if_partial_success:
      - identify_weak_points
      - adjust_validation_thresholds
      - improve_robustness

## 成本控制
cost_controls:
  max_tokens_per_run: 50000
  max_sub_agents: 2
  timeout_per_run: "5m"
  
## 质量门禁
quality_gates:
  - compilation_success: true
  - all_nodes_start: true
  - leader_election_completes: true
  - re_election_succeeds: true
  - node_rejoin_works: true
  - final_state_valid: true

## 监控指标
monitoring_metrics:
  - test_duration
  - memory_usage
  - network_latency
  - election_consistency
  - node_reliability
  
## 成功模式识别
success_patterns:
  capture_when: "all_quality_gates_pass"
  store_as: "success-patterns/cluster-election-{{date}}.md"
  
## 运行命令
run_commands:
  - "cd /disk2/helly_data/code/java/speedboat"
  - "./run-cluster-test.sh"
  
## 清理
cleanup:
  - after_success: "archive_results"
  - after_failure: "preserve_debug_logs"
  - always: "stop_all_nodes"